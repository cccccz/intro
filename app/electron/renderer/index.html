<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; worker-src 'self'" />
  <title>intro</title>
  <link rel="stylesheet" href="./styles.css" />
  <link rel="stylesheet" href="./vendor/katex.min.css" />
</head>
<body>
  <header>
    <strong>intro</strong>
    <span id="lib-path" class="muted">No library open</span>
    <button type="button" id="btn-open">Open library</button>
    <button type="button" id="btn-new-piece" disabled>New piece</button>
    <button type="button" id="btn-open-pdf" disabled>Open PDF…</button>
  </header>
  <div id="workspace">
    <aside id="sidebar">
      <h2>Pieces</h2>
      <ul id="piece-list"></ul>
      <p id="sidebar-empty" class="muted">Open a folder to start. An empty folder is a new library.</p>
    </aside>
    <div id="board">
      <main id="columns"></main>
      <svg class="wires" id="wires" aria-hidden="true"></svg>
    </div>
  </div>
  <footer id="status" class="muted">Open a library, create a first piece, write text, select a span, hang a side.</footer>
  <script src="./vendor/katex.min.js"></script>
  <script src="./vendor/markdown-it.min.js"></script>
  <script type="module" src="./renderer.js"></script>
</body>
</html>
